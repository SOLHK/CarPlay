// JDK 25 tests: set MOCKITO_AGENT_JAR to the resolved mockito-core jar.
// ./gradlew --init-script tools/steam-test-agent.gradle :shared:testDebugUnitTest :common:testDebugUnitTest
allprojects {
    tasks.withType(Test).configureEach {
        def jarPath = System.getenv('MOCKITO_AGENT_JAR')
        if (project.name == 'common' && jarPath) jvmArgs "-javaagent:${jarPath}"
    }
}
