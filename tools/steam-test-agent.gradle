// JDK 25: attach Mockito before tests start instead of using dynamic self-attachment.
// ./gradlew --no-configuration-cache --init-script tools/steam-test-agent.gradle :shared:testDebugUnitTest :common:testDebugUnitTest
allprojects {
    tasks.withType(Test).configureEach {
        maxHeapSize = '1024m'
        maxParallelForks = 1
        doFirst {
            def explicitJar = System.getenv('MOCKITO_AGENT_JAR')
            def agent = explicitJar ?: classpath.files.find {
                it.name.startsWith('mockito-core-') && it.name.endsWith('.jar')
            }?.absolutePath
            if (agent) jvmArgs "-javaagent:${agent}"
        }
    }
}
