plugins {
    id 'com.android.library'
}
def prebuiltNative = providers.environmentVariable("CARPLAY_PREBUILT_NATIVE_DIR").orNull
android {
    namespace = 'com.shilapi.xcertplay.shared'
    compileSdk = 37

    defaultConfig {
        minSdk = 28
        targetSdk = 37

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        if (!prebuiltNative) {
            externalNativeBuild {
                ndkBuild { arguments 'APP_PLATFORM=android-28' }
            }
        }

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    if (prebuiltNative) {
        sourceSets.main.jniLibs.srcDir(prebuiltNative)
    } else {
        ndkVersion = '28.2.13676358'
        externalNativeBuild { ndkBuild { path = file('src/main/jni/Android.mk') } }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}
dependencies {
    implementation libs.androidx.app
    implementation libs.bouncycastle
    implementation libs.jmdns
    testImplementation libs.junit
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'org.mockito:mockito-core:5.20.0'
}
